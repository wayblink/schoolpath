        - heading "01 · 执行摘要" [level=2] [ref=e37]
        - paragraph [ref=e38]: 本次重构不删除现有数据，不把第三方数据直接写进权威业务表，也不把开发监控功能暴露在普通用户的主导航中。
        - generic [ref=e39]:
          - generic [ref=e40]:
            - generic [ref=e41]: "1"
            - heading "产品收敛" [level=3] [ref=e42]
            - paragraph [ref=e43]: 学校查询、升学组合、地图找房、区域政策成为四个一级入口。
          - generic [ref=e44]:
            - generic [ref=e45]: "2"
            - heading "监控保留" [level=3] [ref=e46]
            - paragraph [ref=e47]: 数据源、完整度、学区审计、候选审核和数据库工具迁移到独立 Ops 后台。
          - generic [ref=e48]:
            - generic [ref=e49]: "3"
            - heading "数据分层" [level=3] [ref=e50]
            - paragraph [ref=e51]: 建立 ingest、audit、catalog 三层；现有 public 数据在迁移期冻结并保留。
          - generic [ref=e52]:
            - generic [ref=e53]: "4"
            - heading "全量采集" [level=3] [ref=e54]
            - paragraph [ref=e55]: 参考站先保存 HTML 快照和哈希，再解析、匹配、审核，最后才允许发布。
        - generic [ref=e56]:
          - strong [ref=e57]: 核心决策
          - text: 优先采用同一个 PostgreSQL 实例内的 Schema 隔离，而不是立即拆成多个数据库。这样可以直接进行新旧数据 SQL 比对、保持事务能力，并显著降低迁移和回滚成本。
      - generic [ref=e58]:
        - heading "02 · 设计原则" [level=2] [ref=e59]
        - paragraph [ref=e60]: 所有页面和数据变更遵守以下约束，避免“产品体验提升”以牺牲数据可信度为代价。
        - generic [ref=e61]:
          - generic [ref=e62]:
            - heading "事实与观点分开" [level=3] [ref=e63]
            - paragraph [ref=e64]: 官方政策、招生关系属于事实；梯队、评价属于带来源和年份的观点，不能混成学校永久属性。
          - generic [ref=e65]:
            - heading "固定对口与派位分开" [level=3] [ref=e66]
            - paragraph [ref=e67]: 电脑派位、多校划片、九年一贯、确定对口使用不同关系模型，不为页面简洁而错误建模。
          - generic [ref=e68]:
            - heading "原始证据永不丢失" [level=3] [ref=e69]
            - paragraph [ref=e70]: 每条外部数据都能追溯到抓取批次、原始网页、解析器版本、证据文本和审核动作。
          - generic [ref=e71]:
            - heading "旧数据只迁移不覆盖" [level=3] [ref=e72]
            - paragraph [ref=e73]: 先复制、规范化和比对，再灰度切换 API；旧表至少保留一个完整发布周期。
          - generic [ref=e74]:
            - heading "年度版本优先" [level=3] [ref=e75]
            - paragraph [ref=e76]: 政策、对口、梯队、招生班级和风险提示必须带年份或有效期，禁止无版本覆盖。
          - generic [ref=e77]:
            - heading "发布动作可回滚" [level=3] [ref=e78]
            - paragraph [ref=e79]: 审核与发布均按批次记录，支持撤销某次来源导入，而不是执行不可逆覆盖。
