services:
  postgres:
    image: postgres:16-alpine
    container_name: schoolpath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: schoolpath
      POSTGRES_USER: schoolpath
      POSTGRES_PASSWORD: schoolpath_dev_password
    ports:
      - "15432:5432"
    volumes:
      - schoolpath_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolpath -d schoolpath"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schoolpath-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://schoolpath:schoolpath_dev_password@postgres:5432/schoolpath
      NEXT_PUBLIC_AMAP_KEY: ${NEXT_PUBLIC_AMAP_KEY:-}
      NEXT_PUBLIC_AMAP_SECURITY_CODE: ${NEXT_PUBLIC_AMAP_SECURITY_CODE:-}
    ports:
      - "3000:3000"

volumes:
  schoolpath_pg_data:
