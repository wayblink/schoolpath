.tab.active{background:#667eea;color:#fff}

table.tbl tr:hover td{background:#fafbff}
table.tbl tr.hl td{background:#e8eaf6}

.clickable-row:hover{background:#e8eaf6!important}

    for (var j = 0; j < data.初中.length; j++) {
      var ms = data.初中[j];
      var msShort = ms.名称.replace(/（.*）/, '').replace(/初级中学$/, '').replace(/中学$/, '').replace(/学校$/, '').trim();
      if (msShort === short || msShort.indexOf(short) >= 0 || short.indexOf(msShort) >= 0) {
        tiers[ms.梯队] = true; return;
      }
    }
  });
  var arr = Object.keys(tiers).map(Number).sort(function(a, b) { return a - b; });
  if (arr.length === 0) return null;
  if (arr.length === 1) return String(arr[0]);
  return arr[0] + '-' + arr[arr.length - 1];
}

function formatMsNames(district, msNames){
  if(!msNames||msNames==='—')return'—';
  var data=allData[district];if(!data||!data.初中)return esc(msNames);
  return msNames.split('/').map(function(raw){
    var note=(raw.match(/\(([^)]*)\)/)||[])[1]||'';
    var name=raw.replace(/\([^)]*\)/g,'').trim();
    var tier=0;
    for(var i=0;i<data.初中.length;i++){
      var m=data.初中[i];
      if(m.名称===name||m.名称.indexOf(name)>=0||name.indexOf(m.名称.replace(/（.*）/,''))>=0){tier=m.梯队;break;}
    }
    if(!tier){
      var short=name.replace(/初级中学$/,'').replace(/中学$/,'').replace(/学校$/,'').trim();
      for(var j=0;j<data.初中.length;j++){
        var ms=data.初中[j];
        var msShort=ms.名称.replace(/（.*）/,'').replace(/初级中学$/,'').replace(/中学$/,'').replace(/学校$/,'').trim();
        if(msShort===short||msShort.indexOf(short)>=0||short.indexOf(msShort)>=0){tier=ms.梯队;break;}
      }
    }
    return esc(name)+' '+(tier>0?bm(tier):'')+(note?' ('+note+')':'');
  }).join(' / ');
}
function tags(h){return(h.标签||[]).map(function(t){return'<span class="badge badge-risk">'+t+'</span>'}).join('')}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escattr(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function toggleEvalRow(td){var tr=td.parentElement;var txt=tr.dataset.eval;if(!txt)return;var next=tr.nextElementSibling;if(next&&next.classList.contains('eval-expand')){next.remove();return}var ex=document.createElement('tr');ex.className='eval-expand';ex.innerHTML='<td></td><td colspan="4" style="font-size:11px;color:#555;line-height:1.5;padding:4px 12px 8px;background:#fafafa">'+txt+'</td>';tr.parentNode.insertBefore(ex,tr.nextSibling)}

function initPage(){
  var fd=document.getElementById('fd');
  DISTRICTS.forEach(function(d){
    var o=document.createElement('option');o.value=d;o.textContent=d;fd.appendChild(o);
  });
  buildAll();
  // Pre-select filter state from URL (for back-navigation from map page)
  (function(){
    var p = new URLSearchParams(window.location.search);
    var d = p.get('district');
    if (d && DISTRICTS.indexOf(d) >= 0) document.getElementById('fd').value = d;
    var s = p.get('street');
    if (s) document.getElementById('fs').setAttribute('data-preset', s);
  })();
  var initTab = (new URLSearchParams(window.location.search)).get('tab') || 'index';
  switchTab('tab-' + initTab);
  document.getElementById('fd').addEventListener('change',applyFilters);
  document.getElementById('fs').addEventListener('change',applyFilters);
  document.getElementById('fn').addEventListener('change',applyFilters);
  document.getElementById('fsearch').addEventListener('input',applyFilters);

  document.getElementById('btn-tab-index').addEventListener('click',function(){switchTab('tab-index')});
  document.getElementById('btn-tab-summary').addEventListener('click',function(){switchTab('tab-summary')});
  document.getElementById('btn-tab-detail').addEventListener('click',function(){switchTab('tab-detail')});
}

function actBtns(district, school, middle, lng, lat) {
  var p = new URLSearchParams();
  p.set('district', district);
  if (school) p.set('school', school);
  if (middle) p.set('middle', middle);
  if (lng != null && lat != null && (lng !== 0 || lat !== 0)) {
    p.set('lng', lng);
    p.set('lat', lat);
  }
  // Carry current filter state for back-navigation
  var streetSel = document.getElementById('fs');
  if (streetSel && streetSel.value && streetSel.value !== 'all') p.set('street', streetSel.value);
  var q = p.toString();
  return '<a class="act-btn act-map" href="school-district-map.html?' + q + '" title="在地图中查看学区">🗺️</a>';
}


function validStreet(k){
  if(!k)return false;
  if(k==='待确认'||k==='电脑派位'||k==='特殊招生'||k==='全市招生'||k==='全区招生'||k==='-')return false;
  if(/^\d+$/.test(k))return false;
  return true;
}

function updateDependentOpts(district){
  var fs=document.getElementById('fs'),curS=fs.value;
  var fn=document.getElementById('fn'),curN=fn.value;
  var streets={},schools={};

  if(district==='all'){
    fs.innerHTML='<option value="all">请先选择区域</option>';
    fn.innerHTML='<option value="all">请先选择区域</option>';
    return;
  }

  DISTRICTS.forEach(function(d){
    if(d!==district)return;
    var data=allData[d];if(!data)return;
    (data.小学||[]).forEach(function(s){
      if(s.名称)schools[s.名称]=1;
      var raw=s.街道||s.片区||'';
      if(!raw)return;
      raw.split('/').forEach(function(k){k=k.trim();if(validStreet(k))streets[k]=1;});
    });
    (data.初中||[]).forEach(function(m){
      if(m.名称)schools[m.名称]=1;
    });
  });

  fs.innerHTML='<option value="all">全部</option>';
  var presetStreet = fs.getAttribute('data-preset');
  Object.keys(streets).sort().forEach(function(v){
    var o=document.createElement('option');o.value=v;o.textContent=v;
    if(v===curS || v===presetStreet)o.selected=true;fs.appendChild(o);
  });
  if (presetStreet) fs.removeAttribute('data-preset');

  var schoolList=Object.keys(schools).sort();
  fn.innerHTML='<option value="all">全部</option>';
  schoolList.forEach(function(v){
    var o=document.createElement('option');o.value=v;o.textContent=v;
    if(v===curN)o.selected=true;fn.appendChild(o);
  });
}

function getFilters(){
  return {
    d:document.getElementById('fd').value,
    s:document.getElementById('fs').value,
    n:document.getElementById('fn').value,
    q:document.getElementById('fsearch').value.trim().toLowerCase()
  };
}

function searchMatch(el,q){
  if(!q)return true;
  // Search school name, street, and 居委
  var schoolName = (el.dataset.school||'').toLowerCase();
  var streetName = (el.dataset.street||'').toLowerCase();
  var juwei = (el.dataset.juwei||'').toLowerCase();
  return schoolName.indexOf(q)>=0 || streetName.indexOf(q)>=0 || juwei.indexOf(q)>=0;
}

function rowMatch(el,f){
  if(f.d!=='all'&&el.dataset.district!==f.d)return false;
  if(f.s!=='all'&&el.dataset.street!==f.s)return false;
  if(f.n&&f.n!=='all'&&el.dataset.school!==undefined){
    if(el.dataset.school!==f.n)return false;
  }
  if(!searchMatch(el,f.q))return false;
  return true;
}

function applyFilters(){
  var f=getFilters();
  updateDependentOpts(f.d);
  var tab=document.querySelector('.tab-content:not(.hidden)');
  if(!tab)return;

  // Hide/show individual rows (schools)
  tab.querySelectorAll('[data-district]').forEach(function(el){
    el.classList.toggle('hidden',!rowMatch(el,f));
  });

  // Hide empty street blocks (Tab 3): hide if no visible school cards
  tab.querySelectorAll('.street-block').forEach(function(block){
    var bd=block.closest('[data-district]');
    if(f.d!=='all'&&bd&&bd.dataset.district!==f.d){block.classList.add('hidden');return;}
    if(f.s!=='all'&&block.dataset.street!==f.s){block.classList.add('hidden');return;}
    var visibleRows=block.querySelectorAll('[data-district]:not(.hidden)');
    block.classList.toggle('hidden',visibleRows.length===0);
  });

  // Hide empty district blocks: hide if no visible child rows (Tab 1, Tab 3)
  tab.querySelectorAll('.district-block').forEach(function(block){
    var dbd=block.dataset.district||'';
    if(f.d!=='all'&&dbd!==f.d){block.classList.add('hidden');return;}
    var visibleRows=block.querySelectorAll('[data-district]:not(.hidden)');
    block.classList.toggle('hidden',visibleRows.length===0);
  });
}

function switchTab(id){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  document.getElementById('btn-'+id).classList.add('active');
  document.querySelectorAll('.tab-content').forEach(function(c){c.classList.add('hidden')});
  document.getElementById(id).classList.remove('hidden');
  updateMapTabLinks();
  applyFilters();
}
function updateMapTabLinks() {
  var activeTab = document.querySelector('.tab.active');
  if (!activeTab) return;
  var tab = activeTab.id.replace('btn-tab-', '');
  document.querySelectorAll('.act-map').forEach(function(a) {
    var sep = a.href.indexOf('?') >= 0 ? '&' : '?';
    a.href = a.href.replace(/[?&]tab=[^&]*/g, '') + sep + 'tab=' + tab;
  });
}

function buildAll(){buildTabIndex();buildTabSummary();buildTabDetail();}

// TAB 1: 学校索引 — 只显示 梯队/学校名/街道片区/评价
function buildTabIndex(){
  var html='';
  DISTRICTS.forEach(function(d){
    var data=allData[d];if(!data)return;
    html+='<div class="district-block" data-district="'+d+'">';
    // 小学
    html+='<div class="section"><div class="section-title">🏫 '+d+' — 小学 <span class="badge badge-sys">'+esc(data.入学制度)+'</span></div>';
    html+='<div class="tbl-wrap tbl-wrap-5col"><table class="tbl"><thead><tr><th>梯队</th><th style="min-width:200px">学校</th><th>街道/片区</th><th>评价</th><th style="width:80px">操作</th></tr></thead><tbody>';
    var schools=[].concat(data.小学).sort(function(a,b){return a.梯队-b.梯队});
    schools.forEach(function(s,i){
      var st=s.街道||s.片区||'';
      var jw=s.对口居委||[];if(typeof jw==='string')jw=[jw];
      html+='<tr data-district="'+d+'" data-tier="'+s.梯队+'" data-street="'+esc(st)+'" data-school="'+escattr((s.名称||'').toLowerCase())+'" data-juwei="'+escattr(jw.join(' '))+'" data-eval="'+escattr(s.评价||'')+'"><td>'+bp(s.梯队)+'</td><td class="sch-clickable" onclick="toggleEvalRow(this)"><strong>'+esc(s.名称)+'</strong> '+tags(s)+'</td><td>'+esc(st)+'</td><td class="eval">'+esc(s.评价||'')+'</td><td class="btn-cell">'+actBtns(d, s.名称, s.对口初中||'', s.lng, s.lat)+'</td></tr>';
    });
    html+='</tbody></table></div>';
    // 初中
    html+='<div style="margin-top:12px;font-weight:700;font-size:15px">🏫 '+d+' — 初中</div>';
    html+='<div class="tbl-wrap tbl-wrap-5col"><table class="tbl"><thead><tr><th>梯队</th><th style="min-width:200px">学校</th><th>街道/片区</th><th>评价</th><th style="width:80px">操作</th></tr></thead><tbody>';
    var mids=[].concat(data.初中||[]).sort(function(a,b){return a.梯队-b.梯队});
    mids.forEach(function(m){
      var mst=m.片区||m.所在块||'';
      html+='<tr data-district="'+d+'" data-tier="'+m.梯队+'" data-street="'+esc(mst)+'" data-school="'+escattr((m.名称||'').toLowerCase())+'" data-juwei="" data-eval="'+escattr(m.评价||'')+'"><td>'+bm(m.梯队)+'</td><td class="sch-clickable" onclick="toggleEvalRow(this)"><strong>'+esc(m.名称)+'</strong></td><td>'+esc(mst)+'</td><td class="eval">'+esc(m.评价||'')+'</td><td class="btn-cell">'+actBtns(d, '', m.名称, m.lng, m.lat)+'</td></tr>';
    });
    html+='</tbody></table></div></div></div>';
  });
  document.getElementById('tab-index').innerHTML=html;
}

// TAB 2: 学区总览 — 全部组合，加街道/片区列，初中名后不带梯队标签
function buildTabSummary(){
  var html='<div class="section"><div class="section-title">📊 市区8区小学→初中配对总览（按区排列·全部组合）</div>';
  html+='<div class="tbl-wrap tbl-wrap-8col"><table class="tbl"><thead><tr><th>区</th><th>街道/片区</th><th>小学</th><th style="width:70px">小学梯队</th><th>对口初中</th><th>入学方式</th><th>评价</th><th style="width:80px">操作</th></tr></thead><tbody>';

  DISTRICTS.forEach(function(d){
    var data=allData[d];if(!data)return;
    var schools=[].concat(data.小学).sort(function(a,b){return a.梯队-b.梯队});
    schools.forEach(function(s,i){
      var pt=s.梯队,mt=s.初中梯队||0;
      var st=s.街道||s.片区||'';
      var mid=s.对口初中||'—';
      var way=s.入学方式||data.入学制度||'';
      var ov=null;
      if(mid==='户籍对口(按地段)'){
        ov=JUWOVERLAP[d]&&JUWOVERLAP[d][s.名称];
        if(ov){mid=ov.m;mt=ov.r;if(ov.ratio<1)mid+=' <span style="font-size:9px;color:#888">('+Math.round(ov.ratio*100)+'%)</span>'}
      }
      var hl=pt<=1&&mt<=1?' class="hl"':'';
      var tierCell=ov?bm(mt):(mt>0?bmRange(getMsTierRange(d,s.对口初中)||mt):'—');
      var midDisplay=ov?(mid+' '+bm(mt)):formatMsNames(d,s.对口初中);
      var jws=s.对口居委||[];if(typeof jws==='string')jws=[jws];
      html+='<tr'+hl+' data-district="'+d+'" data-tier="'+pt+'" data-mtier="'+(mt||'')+'" data-street="'+esc(st)+'" data-school="'+escattr((s.名称||'').toLowerCase())+'" data-juwei="'+escattr(jws.join(' '))+'"><td>'+d+'</td><td>'+esc(st)+'</td><td><strong>'+esc(s.名称)+'</strong> <span class="tier-inline">'+bp(pt)+'</span> '+tags(s)+'</td><td>'+bp(pt)+'</td><td><strong>'+midDisplay+'</strong></td><td>'+esc(way)+'</td><td class="eval">'+esc(s.评价||'')+'</td><td class="btn-cell">'+actBtns(d, s.名称, ov?ov.m:(s.对口初中||''), s.lng, s.lat)+'</td></tr>';
    });
  });

  var total=DISTRICTS.reduce(function(s,d){return s+(allData[d]?allData[d].小学.length:0)},0);
  html+='</tbody></table></div><div class="note-line">■ 蓝色高亮=小学一梯队+初中一梯队 | 共 '+total+' 条配对</div></div>';
  document.getElementById('tab-summary').innerHTML=html;
}

// TAB 3
function buildTabDetail(){
  var html='';
  DISTRICTS.forEach(function(d){
    var data=allData[d];if(!data)return;
    html+='<div class="district-block" data-district="'+d+'"><div class="section"><div class="section-title">📍 '+d+' — 各街道/片区详细 <span class="badge badge-sys">'+esc(data.入学制度)+'</span></div>';
    if(data.说明)html+='<p style="font-size:12px;color:#888;margin-bottom:8px">'+esc(data.说明)+'</p>';
    var groups={};
    // Primary schools — split combined-street keys
    data.小学.forEach(function(s,origIdx){
      s._type='ps'; s._oidx=origIdx;
      var rawKey=s.街道||s.片区||'其他';
      var keys=rawKey.split('/');
      keys.forEach(function(key){
        key=key.trim();
        if(!validStreet(key))return;
        if(!groups[key])groups[key]=[];
        groups[key].push(s);
      });
    });
    // Middle schools — split combined keys, skip non-street values
    if(data.初中){
      data.初中.forEach(function(s,origIdx){
        s._type='ms'; s._oidx=origIdx;
        var rawKey=s.街道||s.片区||s.所在块||'';
        var keys=rawKey.split('/');
        keys.forEach(function(key){
          key=key.trim();
          if(!validStreet(key))return;
          if(!groups[key])groups[key]=[];
          groups[key].push(s);
        });
      });
    }
    Object.keys(groups).sort().forEach(function(street){
      var entries=groups[street];
      var pCount=entries.filter(function(e){return e._type==='ps'}).length;
      var mCount=entries.filter(function(e){return e._type==='ms'}).length;
      var label=pCount+'所小学'+(mCount>0?' · '+mCount+'所初中':'');
      html+='<div class="street-block" data-street="'+esc(street)+'"><div class="street-header"><h3>🏘️ '+esc(street)+'</h3><span class="info">'+label+'</span></div>';
      entries.forEach(function(s){
        if(s._type==='ps'){
          var mid=s.对口初中||'—',midOrig=mid;
          var pt=s.梯队;
          var ov=null;
          if(mid==='户籍对口(按地段)'){
            ov=JUWOVERLAP[d]&&JUWOVERLAP[d][s.名称];
            if(ov){mid=ov.m;if(ov.ratio<1)mid+=' <span style="font-size:9px;color:#888">('+Math.round(ov.ratio*100)+'%)</span>'}
          }
          var msDisplay=ov?(mid+' '+bm(ov.r)):formatMsNames(d,midOrig);
var jwh=s.对口居委||[],ddn=s.对口地段||[];
          var allJwTab3=jwh.concat(ddn);
          html+='<div class="school-card" data-district="'+d+'" data-tier="'+pt+'" data-mtier="'+(s.初中梯队||'')+'" data-street="'+esc(street)+'" data-school="'+escattr((s.名称||'').toLowerCase())+'" data-juwei="'+escattr(allJwTab3.join(' '))+'"><div class="school-main"><div class="sn"><span class="sn-content"><span class="badge badge-ps">小学</span> '+esc(s.名称)+' '+bp(pt)+' '+tags(s)+' <span class="arrow">→</span> <span class="mn">'+msDisplay+'</span></span><span class="sn-btn">'+actBtns(d, s.名称, ov?ov.m:(s.对口初中||''), s.lng, s.lat)+'</span></div>';
          if(jwh.length>0)html+='<div class="extra">对口居委：'+jwh.map(function(j){return'<span>'+esc(j)+'</span>'}).join('')+'</div>';
          else if(ddn.length>0){var shown=ddn.slice(0,10);html+='<div class="extra">地段：'+shown.map(function(x){return'<span>'+esc(x)+'</span>'}).join('')+(ddn.length>10?' ...等'+ddn.length+'个':'')+'</div>';}
          html+='</div></div>';
        }
      });
      html+='</div>';
    });
    html+='</div></div>';
  });
  document.getElementById('tab-detail').innerHTML=html;
}
